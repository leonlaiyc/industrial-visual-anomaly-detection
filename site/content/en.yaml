readiness:
  title: "Technical readiness and AI Engineering handoff"
  operational_need: "Production deployment needs real operational constraints and representative factory data, including capture conditions, must-catch defects and review capacity, before technical acceptance criteria can be validated."
  intro: "Technical feasibility is demonstrated on public data. Further real-world validation is proposed. Production-affecting use is not yet justified."
  cols:
    - kind: demonstrated
      title: "Technical feasibility on public benchmark images"
      items:
        - "Normal-only detector, registration and board-region scoring, implemented and unit-tested."
        - "PCB2 confirmatory run: false alarms {{ f.pcb2.v1.fpr.pct }} → {{ f.pcb2.v2.fpr.pct }}, recall {{ f.pcb2.v2.recall.pct }} in both versions."
        - "Robustness to synthetic lighting, blur and shift measured at frozen thresholds."
        - "PCB3 pre-registered illumination-correction experiment, run once; the correction is not adopted."
    - kind: proposed
      title: "Real-world validation"
      items:
        - "Site requirements confirmed by the quality owner: must-catch defect types and sizes, review capacity, cost of a miss versus a review."
        - "Shadow mode on real line images, affecting no decision."
        - "The site checks below as entry gates before any decision is influenced by the tool."
        - "A second Go/No-Go on that evidence."
    - kind: not_validated
      title: "Beyond what this project can show"
      items:
        - "Any factory image, camera, lamp, line speed or real defect mix."
        - "Usability of the review interface; reviewer agreement."
        - "Labour saving or financial return."
        - "Robustness to real (not synthetic) lighting changes."
  risks_title: "Remaining technical risks"
  risks:
    - "Detection: PCB2 recall {{ f.pcb2.v2.recall.pct }} against a proposed {{ f.criteria.recall_min }}; smallest third of defects {{ f.pcb2.small.recall }}."
    - "Lighting: a {{ f.pcb2.dark_pct }} darker image raised PCB2 false alarms by {{ f.pcb2.dark.v2.rise }} pts; brighter images raised PCB3 false alarms by {{ f.pcb3.detail.cond.B1.base.rise }} pts."
    - "Portability: on a green background the original board-finding rule marked {{ f.pcb3_mask.original }} of the frame as board."

sites:
  title: "What a new site or line must prove"
  intro: "PCB1, PCB2 and PCB3 are board types from a public dataset, not manufacturing sites. They still show, concretely, which assumptions break when anything changes."
  cols: ["Risk", "What this project observed", "What a new site must provide or pass"]
  rows:
    - risk: "Background-dependent board segmentation"
      seen: "Grey cloth worked; PCB3's green cloth made the original rule mark {{ f.pcb3_mask.original }} of the frame as board, with no error raised."
      need: "Segmentation check on the site's own normal images: board-mask area within an expected range, visual sign-off of a contact sheet."
    - risk: "Lighting sensitivity"
      seen: "PCB2 false alarms rose by {{ f.pcb2.dark.v2.rise }} pts under a {{ f.pcb2.dark_pct }} darkening; on PCB3, brightness changes also moved the estimated board pose."
      need: "Lighting specification and a brightness/contrast check on every image; a perturbation test at the site's frozen threshold."
    - risk: "Orientation and placement"
      seen: "{{ f.pcb1.rotated_180_pct }} of PCB1 boards were turned half a round; placement varied on every board type."
      need: "Fixture or registration acceptance: pose spread on site normals, no wrong-orientation decisions on a labelled sample."
    - risk: "ROI compatibility"
      seen: "The board region covered {{ f.pcb3.diag.roi_area }} of the PCB3 frame with about {{ f.pcb3.diag.roi_cloth }} cloth inside; false alarms can start on cloth near the board."
      need: "Region built from the site's own normals, coverage gate passing, fail-safe rate on calibration images below the agreed limit."
    - risk: "Small and low-contrast defects"
      seen: "Smallest third of PCB2 defects: {{ f.pcb2.small.recall }} recall."
      need: "A labelled sample of the site's real defect mix; recall per size class reported, not just overall."
    - risk: "Site-specific data and calibration"
      seen: "Every board type needed its own fitted model, board region and threshold."
      need: "Enough normal images for fit and a separate set for calibration; a held-out set the team never looks at during tuning."
    - risk: "Threshold and model versioning"
      seen: "Evaluation refuses to run if the model, config or split changed after the freeze, or if the freeze is not committed."
      need: "Versioned model + threshold + config released together; any change triggers recalibration and a regression run."

handoff:
  title: "What an AI Engineering team would need to implement it"
  intro: "Documented in the repository's handoff guide; none of it has been operated on a line."
  items:
    - title: "Camera and input specification"
      body: "One RGB image of one board, fixed overhead camera, the same board type and background as the fitted model. Other inputs are out of scope."
    - title: "Input-quality checks"
      body: "Proposed: compare each image's brightness, contrast and focus with the training range and route outliers to review, because measured false alarms rise sharply under darkening."
    - title: "Registration and ROI reliability"
      body: "No board found raises an error, never a silent pass. If the board mask is not inside the board region, the whole-frame score is used (more conservative). Fallback rate is a monitored quantity; calibration stops if it exceeds its limit."
    - title: "Model and threshold versioning"
      body: "Model, threshold, config and split are hashed at freeze; evaluation refuses mismatches. Every release carries its freeze record."
    - title: "Site-specific evaluation"
      body: "Each new board, background, camera or lamp is fitted, calibrated and evaluated on its own data, with a held-out set nobody tunes on."
    - title: "Monitoring and regression tests"
      body: "Track review rate, fallback rate, brightness drift and reviewer-confirmed false alarms per shift. Unit, end-to-end and consistency tests re-run on every change."
    - title: "Rollback and incident handling"
      body: "Keep the previous model and threshold set deployable; roll back on a review-rate or fallback-rate alarm, then recalibrate offline. The tool only recommends; unclear cases and any suspected systematic miss go to the quality owner."
    - title: "Handoff documentation"
      body: "How to run and reproduce, known failure modes, configuration ownership and licensing notes are in the repository's handoff guide."

terms:
  title: "Terms used on this page"
  items:
    - term: "Recall"
      def: "Share of defective boards the tool sends to human review."
    - term: "False-alarm rate"
      def: "Share of normal boards the tool sends to review. The tool only recommends a review, so a false alarm costs reviewer time, not product."
    - term: "AUROC"
      def: "Threshold-free ranking quality: the probability that a random defective board scores higher than a random normal one."
    - term: "Frozen threshold (P95)"
      def: "The score above which an image is flagged, set from separate normal images to target about {{ f.target_fpr }} false alarms, and fixed before any test image is scored."
    - term: "Pre-registration"
      def: "Writing the hypothesis, data split, endpoint and decision rule into the repository before the test data is opened."
    - term: "Difference-in-differences"
      def: "How much less (or more) the candidate's false alarms rise under a perturbation than the baseline's, on the same images."
    - term: "Shadow mode"
      def: "Running the tool alongside existing inspection without affecting any decision, to measure it on real production images."
    - term: "Out-of-fold"
      def: "In cross-validation, a score given to an image by the model that was not trained on it."

