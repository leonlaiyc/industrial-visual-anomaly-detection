terms:
  title: "Terms used on this page"
  items:
    - term: "Recall"
      def: "Share of defective boards that the tool sends to human review. A missed defect is a defective board it does not flag."
    - term: "False-alarm rate"
      def: "Share of normal boards that the tool sends to review. Because the tool only recommends a review — it never rejects or scraps a board — a false alarm costs reviewer time, not product."
    - term: "AUROC"
      def: "Threshold-free ranking quality: the probability that a random defective board scores higher than a random normal one."
    - term: "Frozen threshold (P95)"
      def: "The score above which an image is flagged, set from separate normal images to target about {{ f.target_fpr }} false alarms, and fixed before any test image is scored."
    - term: "Pre-registration"
      def: "Writing the hypothesis, data split, endpoint and decision rule into the repository before the test data is opened, so results cannot steer the analysis."
    - term: "Shadow mode"
      def: "Running the tool alongside the existing inspection without affecting any decision, to measure it on real production images."

path:
  title: "Delivery path"
  intro: "Seven stages, with what this project actually did at each. Stages two and three were drafted only as proposals before testing; in a real engagement they would come first, with the users."
  phase_a: "Phase A · completed technical feasibility"
  phase_b: "Phase B · proposed operational validation"
  stages:
    - name: "Understand the problem"
      evidence: "Board pose, lighting and background inspected on training images only; one-class learning chosen because defects are rare and varied."
    - name: "Requirements and decision value"
      evidence: "Proposed targets and Go/No-Go rules fixed before any test. Cost-sensitivity analysis added afterwards; no user has confirmed either."
    - name: "First-Time-Right alignment"
      evidence: "Proposed review workflow and interface mock-up built from real model output, with an acceptance checklist for a real user to confirm."
    - name: "Model selection and implementation"
      evidence: "Frozen-feature Mahalanobis detector, implemented and unit-tested; alternatives compared on labels, objective and cost."
    - name: "Controlled experiments"
      evidence: "PCB1 discovery, one pre-registered change, a single confirmatory run on PCB2; one controlled illumination experiment on PCB3."
    - name: "Go / No-Go"
      evidence: "Rule-based verdict against the unchanged criteria; recommendation: no pilot yet."
    - name: "Site readiness and handoff"
      evidence: "Each observed failure mapped to what a new site must validate; versioned handoff with gates, rollback and escalation."

