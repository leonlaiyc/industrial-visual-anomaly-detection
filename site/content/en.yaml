problem:
  title: "Problem and assumptions"
  q_problem: "Inspection problem"
  a_problem: "On a production line, defects are rare and varied, so labelled defect examples are usually scarce. For the normal-only pipeline, VisA defect labels and masks are reserved for evaluation and illustration. The separate PCB4 supervised study uses defect annotations for YOLO training. Question: can a model that has only seen good boards send the right images to a reviewer, without burying the reviewer in false alarms?"
  q_assume: "Working assumptions"
  assumptions:
    - "Review support, not disposition: the tool recommends a human review and never rejects a board, so a false alarm costs reviewer time, not product."
    - "One fixed overhead camera, one board type per model; each new board type gets its own fit, board region and threshold."
    - "Acceptance targets (recall ≥ {{ f.criteria.recall_min }}, false alarms ≤ {{ f.criteria.fpr_max }}, AUROC ≥ {{ f.criteria.auroc_min }}, latency ≤ {{ f.criteria.latency_max }}) are the developer's proposal, written before any test and never edited after a result."
    - "Public benchmark images and synthetic perturbations stand in for a line; they cannot show real lighting drift or a real defect mix."
  q_status: "What is not established"
  status: "No manufacturing user was involved, no factory image was used, no pilot was run, and no labour saving or financial return was measured. Reported metrics were cross-checked against the recorded per-image scores using a separate verification implementation. AI-assisted technical review was performed; final project-owner review remains pending."

