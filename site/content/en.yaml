lifecycle:
  title: "Delivery lifecycle: seven decisions"
  intro: "Each stage states the decision taken, the evidence behind it, what it costs, and what should happen next. Status: demonstrated in this project, proposed for a real engagement, or pending evidence that only operations can provide."
  labels:
    decision: "Decision"
    evidence: "Evidence"
    tradeoff: "Trade-off"
    next: "Next action"
  stages:
    - name: "Preliminary value and Go/No-Go"
      status: demonstrated
      decision: "Frame the tool as review support — it never rejects a board — and write proposed targets and No-Go rules before any test."
      evidence: "Targets (recall ≥ {{ f.criteria.recall_min }}, false alarms ≤ {{ f.criteria.fpr_max }}, AUROC ≥ {{ f.criteria.auroc_min }}, latency ≤ {{ f.criteria.latency_max }}) unchanged since v1; every run is scored against them by code."
      tradeoff: "The targets are the developer's proposal, not a user's requirement. They keep the verdict honest; they do not make it right."
      next: "Replace them with targets agreed with a quality owner."
    - name: "Evidence-based understanding of user needs"
      status: proposed
      decision: "Do not guess the reviewer's workflow. List the questions only a user can answer: cost of a miss versus a false alarm, review capacity, which defects matter."
      evidence: "Requirements document marks every target as proposed; the cost analysis is a break-even range, not a saving."
      tradeoff: "No manufacturing user was interviewed in this project."
      next: "Interview a quality engineer and observe one inspection shift; record the agreed cost ratio and capacity."
    - name: "First-Time-Right alignment"
      status: proposed
      decision: "Show a mock-up built from real model output before building any interface or integration."
      evidence: "The workflow mock-up below uses real images, real heat maps and recorded scores — including a false alarm and a missed defect."
      tradeoff: "A mock-up communicates the idea; it says nothing about usability until someone uses it."
      next: "Walk an inspector through it; turn each field into an acceptance criterion or remove it."
    - name: "Model selection and implementation"
      status: demonstrated
      decision: "Frozen pretrained CNN features with a per-position Gaussian (Mahalanobis) model: learns from good boards only, no training loop, explainable heat map."
      evidence: "Implemented with unit tests, freeze checks and consistency gates; one change at a time (v2 = board-region scoring)."
      tradeoff: "Weak on small and low-contrast defects; supervised detectors were not tested here."
      next: "Only once Phase B yields real defect labels, compare against a supervised detector on those labels."
    - name: "Controlled validation"
      status: demonstrated
      decision: "Pre-register each controlled change, freeze thresholds on separate normal images, evaluate once on a board type not used in development."
      evidence: "PCB2: false alarms {{ f.pcb2.v1.fpr.pct }} → {{ f.pcb2.v2.fpr.pct }} with recall unchanged. PCB3 lighting experiment: the pre-registered rule says “improvement supported” (weakly informative), but the correction is not adopted because it made blur false alarms rise by {{ f.pcb3.result.blur.cand.rise }} pts."
      tradeoff: "Benchmark images and synthetic perturbations, not a production domain shift. Two deviations are disclosed: PCB3 Addendum B1 committed after fitting, and one analysis-code repair after PCB3 test scoring that changed no score or decision."
      next: "Run the same protocol on site images in shadow mode."
    - name: "Value realization and Go/No-Go"
      status: pending
      decision: "No-Go for a pilot; Go for a bounded validation step."
      evidence: "Rule-based verdict for PCB2 v2: {{ f.pcb2.verdict.v2 }} (recall below target, at the No-Go floor). Break-even analysis shows when review support beats reviewing everything or nothing."
      tradeoff: "Without operational data no labour saving or financial return can be claimed."
      next: "Repeat the Go/No-Go with shadow-mode results and the user's own costs."
    - name: "Cross-site readiness, maintenance and handoff"
      status: proposed
      decision: "Treat each new board, background, camera or lamp as a new site that must pass its own checks."
      evidence: "Versioned configs and thresholds; evaluation refuses a changed model or uncommitted freeze; PCB3 proved that board segmentation does not transfer automatically."
      tradeoff: "Monitoring, rollback and escalation are documented, not operated."
      next: "Turn the site checklist below into pilot entry gates."

evidence:
  title: "What the data actually showed"
  intro: "Findings from this project, in the order they shaped decisions. Each states the board type, whether it was measured, demonstrated or found after the fact, and what it changes."
  so: "So:"
  items:
    - tag: "PCB1"
      status: demonstrated
      title: "Boards arrive in different orientations"
      body: "{{ f.pcb1.rotated_180 }} of {{ f.pcb1.n_fit }} training images ({{ f.pcb1.rotated_180_pct }}) were turned half a round; placement and tilt also varied."
      so: "Registration (centroid, tilt, and a template check for the half-turn) runs before any modelling."
    - tag: "PCB1"
      status: post_hoc
      title: "False alarms came from the background"
      body: "All {{ f.pcb1.fa_offboard }} false alarms of v1 on PCB1 normals peaked on the cloth (dust, lint), not on the board."
      so: "v2 takes the score over the board region only. PCB1 could not confirm this, so it was tested on PCB2."
    - tag: "PCB2"
      status: measured
      title: "Board-region scoring cut false alarms"
      body: "On a held-back board type, test false alarms fell from {{ f.pcb2.v1.fpr.pct }} to {{ f.pcb2.v2.fpr.pct }} ({{ f.pcb2.paired.fpr_test.delta }} pts, CI {{ f.pcb2.paired.fpr_test.ci_low }} to {{ f.pcb2.paired.fpr_test.ci_high }}); AUROC rose from {{ f.pcb2.v1.auroc.fmt }} to {{ f.pcb2.v2.auroc.fmt }}."
      so: "The change works for the problem it targeted."
    - tag: "PCB2"
      status: measured
      title: "Recall did not improve"
      body: "{{ f.pcb2.v2.recall.pct }} of defects flagged by both versions, against a proposed {{ f.criteria.recall_min }}; the pre-registered recall hypothesis was not supported. Smallest third of defects: {{ f.pcb2.small.recall }} ({{ f.pcb2.small.frac }})."
      so: "Detection sensitivity, not false alarms, is now the binding constraint."
    - tag: "PCB2"
      status: measured
      title: "Darkening breaks the operating point"
      body: "A {{ f.pcb2.dark_pct }} darker, lower-contrast copy of each image raised v2 false alarms from {{ f.pcb2.dark.v2.clean }} to {{ f.pcb2.dark.v2.dark }}; brightening did not."
      so: "Lighting must be controlled or corrected — and that must be validated — before a line trial."
    - tag: "PCB3"
      status: demonstrated
      title: "Board-finding assumed a grey background"
      body: "On PCB3's saturated green cloth the original colour rule marked {{ f.pcb3_mask.original }} of every frame as board, so registration silently did nothing. A hue band measured on training images restored a board mask of {{ f.pcb3_mask.adapted }}."
      so: "Background-dependent preprocessing must be re-validated at every site; it failed silently here."
    - tag: "PCB3"
      status: demonstrated
      title: "Registration and the board region are only approximately portable"
      body: "Without correction, a {{ f.pcb2.dark_pct }} darkening moved the estimated board pose by {{ f.pcb3.diag.base_G1.warp_median }} px (median) on training images. The board region covers {{ f.pcb3.diag.roi_area }} of the frame; about {{ f.pcb3.diag.roi_cloth }} of its pixels are cloth."
      so: "Lint close to the board can still trigger a false alarm (see the workflow example); pose estimation depends on brightness."
    - tag: "PCB3"
      status: measured
      title: "Illumination correction experiment"
      body: "The pre-registered rule returned “improvement supported”: under global darkening the candidate's false-alarm rise was {{ f.pcb3.result.cond.G1.fpr.d_cand }} pts versus {{ f.pcb3.result.cond.G1.fpr.d_base }} pts (difference {{ f.pcb3.result.cond.G1.fpr.did }}, CI {{ f.pcb3.result.cond.G1.fpr.ci_low }} to {{ f.pcb3.result.cond.G1.fpr.ci_high }}). But the baseline barely failed on PCB3, so the endpoint is weakly informative — and the correction made a mild blur raise false alarms by {{ f.pcb3.result.blur.cand.rise }} pts (baseline {{ f.pcb3.result.blur.base.rise }})."
      so: "Not adopted. A correction can trade one sensitivity for another; every fix must be checked against the full set of perturbations, not only the one it targets."
  fig_mask_alt: "Three panels of one PCB3 training image: the photo, the original board mask covering almost the whole frame in magenta, and the adapted mask covering only the board."
  fig_mask_caption: "PCB3 training image: as captured · original colour rule (magenta = classed as board, {{ f.pcb3_mask.original }} of the frame) · after the hue-band adaptation ({{ f.pcb3_mask.adapted }}). Median over {{ f.pcb3_mask.n_fit }} training images. VisA image, CC BY 4.0, resized with overlay."

