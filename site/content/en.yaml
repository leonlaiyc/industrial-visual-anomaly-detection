brief:
  title: "At a glance"
  q_problem: "Inspection problem"
  a_problem: "On a production line, defects are rare and varied, so labelled defect examples are usually scarce. This project therefore fits its model on normal images only — deliberately, even though the public VisA dataset does provide defect labels and masks; here they are used only to evaluate and to illustrate. Question: can a model that has only seen good boards send the right images to a reviewer, without burying the reviewer in false alarms?"
  q_built: "What was built"
  a_built: "A working prototype: frozen pretrained CNN features, a per-position Gaussian (Mahalanobis) model of normal appearance, board registration, and — in v2 — a score taken over the board region only. Thresholds are set on separate normal images and frozen before any test image is scored."
  q_risks: "Remaining risks"
  risks:
    - "Detection: PCB2 recall {{ f.pcb2.v2.recall.pct }} against a proposed {{ f.criteria.recall_min }}; smallest third of defects {{ f.pcb2.small.recall }}."
    - "Lighting: a {{ f.pcb2.dark_pct }} darker image raised PCB2 false alarms by {{ f.pcb2.dark.v2.rise }} pts; brighter images raised PCB3 false alarms by {{ f.pcb3.detail.cond.B1.base.rise }} pts."
    - "Portability: on a green background the original board-finding rule marked {{ f.pcb3_mask.original }} of the frame as board."
  q_status: "What is not established"
  status: "No manufacturing user was interviewed, no factory image was used, no pilot was run, and no labour saving or financial return was measured. The requirements are the developer's proposal, not a user's. A separate engineering review recomputed the reported results from the raw score files and found them consistent; the project owner's review and acceptance are pending."

