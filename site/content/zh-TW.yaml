brief:
  title: "重點摘要"
  q_problem: "檢測問題"
  a_problem: "在實際產線上，瑕疵少見且型態多變，已標註的瑕疵樣本通常很少。因此本專案刻意只用良品影像建立模型——雖然公開的 VisA 資料集其實附有瑕疵標籤與遮罩，但在這裡只用於評估與圖示說明。要回答的問題是：只看過良品的模型，能否把該看的影像送到複檢人員面前，又不會讓誤報多到淹沒複檢人員？"
  q_built: "實際做了什麼"
  a_built: "一個可運作的原型：凍結的預訓練 CNN 特徵、針對每個影像位置建立的良品外觀高斯模型（以馬氏距離計分）、影像對位；v2 再改為只在電路板區域內計分。門檻值以另一批良品影像設定，並在任何測試影像計分前凍結。"
  q_risks: "仍存在的風險"
  risks:
    - "檢出能力：PCB2 瑕疵檢出率 {{ f.pcb2.v2.recall.pct }}，未達提議的 {{ f.criteria.recall_min }}；面積最小的三分之一瑕疵只有 {{ f.pcb2.small.recall }}。"
    - "光照穩健性：影像變暗 {{ f.pcb2.dark_pct }} 時，PCB2 誤報率上升 {{ f.pcb2.dark.v2.rise }} 個百分點；影像變亮時，PCB3 誤報率上升 {{ f.pcb3.detail.cond.B1.base.rise }} 個百分點。"
    - "可移植性：背景換成綠色布面後，原本的電路板分割規則把畫面的 {{ f.pcb3_mask.original }} 都當成電路板。"
  q_status: "尚未確立的事"
  status: "沒有訪談任何製造端使用者、沒有使用工廠影像、沒有進行試行，也沒有量測任何人力節省或財務報酬。驗收目標是開發者的提議，不是使用者提出的需求。另一位審查者已從原始分數檔重算報告中的結果，確認一致；專案負責人的審閱與驗收尚未完成。"

