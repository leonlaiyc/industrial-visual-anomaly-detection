problem:
  title: "問題與前提假設"
  q_problem: "檢測問題"
  a_problem: "在實際產線上，瑕疵少見且型態多變，已標註的瑕疵樣本通常很少。因此本專案刻意只用良品影像建立模型——雖然公開的 VisA 資料集其實附有瑕疵標籤與遮罩，但在這裡只用於評估與圖示說明。要回答的問題是：只看過良品的模型，能否把該看的影像送到複檢人員面前，又不會讓誤報多到淹沒複檢人員？"
  q_assume: "前提假設"
  assumptions:
    - "定位為複檢輔助，而非直接判定：工具只建議送人工複檢，從不判定板子不良，所以誤報的代價是複檢人員的時間，而不是產品本身。"
    - "固定的俯拍相機，每個模型只對應一種板型；每種新板型都要重新擬合、建立自己的電路板區域與門檻值。"
    - "驗收目標（瑕疵檢出率 ≥ {{ f.criteria.recall_min }}、誤報率 ≤ {{ f.criteria.fpr_max }}、AUROC ≥ {{ f.criteria.auroc_min }}、延遲 ≤ {{ f.criteria.latency_max }}）是開發者的提議，在任何測試前寫定，看到結果後從未修改。"
    - "以公開基準影像與合成擾動代替產線條件；它們無法呈現真實的光照漂移或實際的瑕疵組成。"
  q_status: "尚未確立的事"
  status: "沒有任何製造端使用者參與、沒有使用工廠影像、沒有進行試行，也沒有量測任何人力節省或財務報酬。已使用另一套驗證程式，依逐張影像的原始分數重新核對報告數據。技術檢查由 AI 輔助完成，專案負責人尚未完成最終審閱。"

