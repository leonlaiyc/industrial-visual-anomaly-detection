  desc: "單位圖。良品：v1 在 {{ f.pcb2.v1.fpr.n }} 張中標記 {{ f.pcb2.v1.confusion.FP }} 張，v2 標記 {{ f.pcb2.v2.confusion.FP }} 張。瑕疵品：v1 與 v2 都在 {{ f.pcb2.v2.recall.n }} 張中抓到 {{ f.pcb2.v2.confusion.TP }} 張。"
