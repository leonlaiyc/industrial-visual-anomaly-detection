data:
  title: "資料集與觀察"
  intro: "VisA（Amazon Science，CC BY 4.0）每種電路板類型約有一千張良品影像與一百張附像素遮罩的瑕疵影像。PCB1 是開發用板型；PCB2 與 PCB3 都是在各自的實驗計畫提交之後才開啟。"
  split_title: "每種板型的資料切分方式"
  split:
    - "<strong>擬合集</strong>——模型學習用的良品影像（{{ f.pcb3.split.fit }} 張）。"
    - "<strong>校準集</strong>——另一批良品影像，用來設定門檻值，並在測試前凍結（{{ f.pcb3.split.calib }} 張）。"
    - "<strong>保留集</strong>——從未用於任何選擇的額外良品影像；提供第二個誤報率估計。"
    - "<strong>官方測試集</strong>——資料集本身的測試良品與全部瑕疵品，只計分一次。"
  split_note: "資料切分由固定亂數種子的腳本產生，以檔案雜湊值稽核重疊與重複，並在建模前提交。上列數量為 PCB3 的數字。"
  observations_title: "檢視訓練影像時發現的事"
  so: "因此："
  observations:
    - tag: "PCB1"
      status: demonstrated
      title: "電路板擺放方向不一致"
      body: "{{ f.pcb1.n_fit }} 張訓練影像中，有 {{ f.pcb1.rotated_180 }} 張（{{ f.pcb1.rotated_180_pct }}）旋轉了半圈；位置與傾斜角度也各不相同。"
      so: "建模之前，一律先做影像對位（重心、傾角，再以模板判斷是否旋轉半圈）。"
    - tag: "PCB1"
      status: post_hoc
      title: "誤報來自背景"
      body: "v1 在 PCB1 良品上的 {{ f.pcb1.fa_offboard }} 次誤報，異常最高點全都落在布面（灰塵、棉絮）上，而不在電路板上。"
      so: "v2 只在電路板區域內取分數。這項假設無法在 PCB1 上確認，因此改在 PCB2 上測試。"
    - tag: "PCB1"
      status: demonstrated
      title: "基準資料集的混淆因子"
      body: "PCB1 的測試瑕疵品大多是旋轉半圈後拍攝的，而良品大多沒有。"
      so: "沒有影像對位的模型，可能靠偵測「方向」而非瑕疵就拿到好分數；影像對位消除了這條捷徑。"

model:
  title: "候選方法與選擇理由"
  intro: "這個階段需要的是一個只用良品的基準方法：幾分鐘內就能以無瑕疵影像完成擬合、能向工程師解釋，而且可以凍結。下表是選擇理由；凍結的正式評估只使用本專案採用的方法。"
  cols: ["方法", "需要的標註", "輸出", "適用情境", "主要風險"]
  rows:
    - name: "凍結 CNN 特徵＋逐位置高斯模型（本專案採用）"
      labels: "只需要良品影像"
      output: "異常分數與熱圖"
      fits: "瑕疵少見且無法事先列舉；有人員參與複檢"
      risk: "特徵看起來正常的細微瑕疵會漏檢；對擺放位置與光照敏感"
    - name: "物件偵測模型（YOLOv8、YOLO11）"
      labels: "每種瑕疵都要框選標註，且每種都需要大量樣本"
      output: "瑕疵位置與類別"
      fits: "瑕疵種類已知、穩定且樣本充足，而且需要分類"
      risk: "對訓練中沒有的瑕疵類型，檢出率會明顯下降（見下方實驗）；標註與維護成本高"
    - name: "微調分類模型或骨幹網路"
      labels: "已標註的良品與不良品影像"
      output: "整張影像的類別或分數"
      fits: "已有足夠的瑕疵標註，製程穩定"
      risk: "瑕疵樣本少時容易過擬合；需要訓練、驗證與再訓練流程"
    - name: "黃金樣本比對或規則式方法"
      labels: "不需要，但每項產品都要調參"
      output: "與參考影像的差異"
      fits: "治具、光源與產品都受到嚴格控制"
      risk: "擺放、光照或正常的個體差異一有變化就會失效"
  note: "選擇只用良品的模型，是針對這個階段（沒有瑕疵標註、有人員複檢）的判斷，並不是主張它勝過監督式模型。"

explore:
  title: "實際測試替代方案：在未使用過的板型上訓練 YOLOv8 與 YOLO11"
  banner: "探索性研究——與凍結的 PCB1–PCB3 評估分開，有自己的實驗計畫、資料與程式碼；不改變任何先前的結果或決策。"
  intro: "與其只依賴文獻描述，我們實際訓練並量測了主要的替代方案。實驗計畫在開啟 VisA 第四種板型（PCB4）之前就已提交：使用現成的 YOLOv8s 與 YOLO11s、固定的預設參數，對 {{ f.explore.n_defects }} 張瑕疵影像做五折交叉驗證（每一折有 {{ f.explore.train_defects }} 張框選標註的瑕疵：{{ f.explore.train_fit }} 張用於訓練、{{ f.explore.train_val }} 張用於選擇檢查點），任務與門檻規則都與本專案相同——以另外 {{ f.explore.n_calib }} 張良品影像設定門檻值，判斷影像是否送人工複檢。"
  pending: "訓練仍在進行中；依實驗計畫完成分析後，結果會顯示在這裡。"
  cols: ["方法", "監督方式", "瑕疵檢出率（交叉驗證外折）", "誤報率（測試良品）", "AUROC", "延遲中位數"]
  sup_normal: "只用良品影像"
  sup_boxes: "框選標註的瑕疵＋良品"
  ref_m: "只用良品（本專案流程，無影像對位）"
  ref_m_reg: "只用良品（本專案流程，含影像對位）"
  size_title: "依瑕疵大小的檢出率（遮罩面積三等分）"
  size_cols: ["方法", "最小的三分之一", "中間的三分之一", "最大的三分之一"]
  unseen_title: "偵測模型從未看過的瑕疵類型"
  unseen_cols: ["保留的類型", "影像數", "訓練時有此類型", "訓練時沒有此類型", "只用良品"]
  unseen_note: "YOLO11s 在只含該類型瑕疵的影像上的檢出率，分別為訓練資料中有與沒有該類型時；只用良品的模型使用同一批影像。"
  fold_range: "各折"
  read_title: "如何解讀"
  read:
    - "<strong>有同類型瑕疵的標註時，兩個偵測模型幾乎抓到所有瑕疵：</strong>YOLOv8s {{ f.explore.by.yolov8s.recall }}、YOLO11s {{ f.explore.by.yolo11s.recall }}，只用良品的流程為 {{ f.explore.by.m.recall }}；在全部測試良品上的整體誤報率相近（但請見下一點）。YOLO11s 與只用良品的成對差異：瑕疵檢出率 {{ f.explore.by.yolo11s.d_recall }} 個百分點（信賴區間 {{ f.explore.by.yolo11s.d_recall_lo }} 至 {{ f.explore.by.yolo11s.d_recall_hi }}），誤報率 {{ f.explore.by.yolo11s.d_fpr }} 個百分點（信賴區間 {{ f.explore.by.yolo11s.d_fpr_lo }} 至 {{ f.explore.by.yolo11s.d_fpr_hi }}）。面積最小的三分之一瑕疵：{{ f.explore.by.yolo11s.small }} 對 {{ f.explore.by.m.small }}。這個樣本無法排出兩個偵測模型的高下：兩者只在少數瑕疵影像上判斷不同（{{ f.explore.audit.v8_only }} 張只有 YOLOv8s 抓到，{{ f.explore.audit.v11_only }} 張只有 YOLO11s 抓到）。"
    - "<strong>事後檢查：多數標記落在瑕疵上，但存在拍攝條件的線索。</strong>在被標記的瑕疵影像中，有 {{ f.explore.loc.yolo11s.top }} 張決定 YOLO11s 分數的框，碰到向外擴張 {{ f.explore.loc.yolo11s.tol }} 像素後的標準答案瑕疵範圍（YOLOv8s 為 {{ f.explore.loc.yolov8s.top }}）。這個定義只要求框「碰到」瑕疵，不要求框「對準」瑕疵；若要求與標準答案框的 IoU ≥ {{ f.explore.audit.iou_min }}，數字為 {{ f.explore.audit.iou.yolo11s }} 與 {{ f.explore.audit.iou.yolov8s }}。稽核另外發現：PCB4 的瑕疵影像平均比良品影像暗（只看亮度就能以 AUROC {{ f.explore.audit.dark_auroc }} 區分兩者），而且 YOLO 在沒有瑕疵的影像上，影像越暗分數越高。把測試良品依瑕疵影像的亮度分布重新加權後，YOLO 的誤報率為 {{ f.explore.audit.fpr_dark.yolov8s }}（YOLOv8s）與 {{ f.explore.audit.fpr_dark.yolo11s }}（YOLO11s），只用良品的流程為 {{ f.explore.audit.fpr_dark.m }}。若改用亮度相符的良品來設定門檻，檢出率仍為 {{ f.explore.audit.recall_matched_cal.yolov8s }} 與 {{ f.explore.audit.recall_matched_cal.yolo11s }}（只用良品 {{ f.explore.audit.recall_matched_cal.m }}）：檢出率的差距看來不是亮度造成的，但上面的整體誤報率低估了暗影像上的誤報率。框層級的 mAP50 偏低（{{ f.explore.by.yolo11s.map50 }}），本研究沒有分析原因。"
    - "<strong>遇到訓練中沒有的瑕疵類型時，大部分優勢消失了。</strong>以「missing」為例，訓練時有此類型，YOLO11s 抓到 {{ f.explore.unseen.missing.seen }}；沒有此類型時只抓到 {{ f.explore.unseen.missing.unseen }}——接近只用良品的水準（{{ f.explore.unseen.missing.normal_only }}）。「extra」則為 {{ f.explore.unseen.extra.seen }}、{{ f.explore.unseen.extra.unseen }} 與 {{ f.explore.unseen.extra.normal_only }}。樣本極小，而且保留類型的訓練也少了幾張瑕疵影像。訓練中沒有「missing」時的命中，並不是偵測到缺件本身：在 {{ f.explore.audit.unseen_missing_flagged }} 張被標記的影像中，只有 {{ f.explore.audit.unseen_missing_top_touch }} 張的最高分框碰到瑕疵，IoU ≥ {{ f.explore.audit.iou_min }} 的框則有 {{ f.explore.audit.unseen_missing_any_iou }} 張。"
    - "<strong>只用良品的數字，不是對只用良品方法的定論。</strong>在 PCB4 上，流程沒有任何針對該板型的前處理——實驗計畫明定不做新的 PCB4 開發——而使用原本的影像對位規則時表現更差（{{ f.explore.by.m_reg.recall }}）。這顯示 PCB2、PCB3 所做的逐板型調整有多重要。"
    - "<strong>工程上的解讀。</strong>依這次的證據，一旦有具代表性的瑕疵標註，對於標註涵蓋到的瑕疵類型，監督式偵測模型是這個複檢任務較強的候選方案。這是比較兩種標註量不同的學習方式，不是比較兩種架構，也不代表偵測模型在一般情況下比較好。但它在未見過的類型上，檢出率降到大約只用良品的水準，所以無論採用哪種方法，都需要處理新瑕疵類型的計畫——例如持續標註的流程，或互補的檢查機制。兩種方法都沒有在工廠影像上測試過。"
  limits: "監督方式不同：偵測模型是以同一種板型、同樣瑕疵類型的框選標註訓練，再在這些類型上測試；只用良品的模型沒有看過任何瑕疵。樣本很小（{{ f.explore.n_defects }} 張瑕疵、{{ f.explore.n_test_normal }} 張測試良品）；未見類型的結果只建立在 {{ f.explore.unseen_n_total }} 張影像上，只能看出很大的差異。同一批 {{ f.explore.audit.unique_normals }} 張測試良品由五個交叉驗證模型各評分一次，所以 YOLO 合併後的誤報率建立在 {{ f.explore.audit.evals }} 次評估、{{ f.explore.audit.unique_normals }} 張影像上，而不是彼此獨立的影像。延遲僅供參考，不能用來排名速度：單一 GPU、一次一張、從讀檔到出分數的中位數，但輸入尺寸不同（YOLO 為 {{ f.explore.audit.yolo_imgsz }} 像素加邊縮放；只用良品為 {{ f.explore.audit.ref_size }}），只有含對位的版本包含影像對位，只在 {{ f.explore.audit.lat_n }} 張影像上量測一次，YOLO 也只用其中一個交叉驗證模型。事後檢查與稽核檢查都是在看過結果之後才加上的；檔案：<code>{{ f.explore.audit.dir }}</code>。PCB4 的數字不能與 PCB1–PCB3 比較，也不代表比 v2 進步。Ultralytics 採用 AGPL-3.0 授權；本研究只在獨立的本機環境中使用，並未列入專案的相依套件。"
  where: "實驗計畫、資料切分稽核、逐張影像分數與分析：<code>{{ f.explore.dir }}</code>。"

arch:
  title: "架構與實作"
  intro: "輸入一張影像，輸出一個建議。每個階段都是一個有自己單元測試的小模組；所有板型共用同一套程式碼，由版本化的設定檔驅動。"
  steps:
    - name: "影像對位"
      body: "依顏色找出電路板，修正位移與傾斜，再以模板相關性判斷是否旋轉半圈。"
      code: "align.py"
    - name: "裁切與縮放"
      body: "從對位後的畫面取中央區域，縮放成模型輸入尺寸。"
      code: "features.py"
    - name: "擷取特徵"
      body: "凍結的 ImageNet Wide-ResNet-50-2，取 layer2 與 layer3、固定的隨機通道子集，並做局部平均。"
      code: "features.py"
    - name: "建立良品外觀模型"
      body: "對每個位置建立良品特徵的高斯模型；每個區塊的異常程度就是它的馬氏距離。"
      code: "gaussian.py"
    - name: "計算影像分數"
      body: "取平滑後異常圖的最大值：v1 取整張畫面，v2 只取電路板區域。"
      code: "roi.py"
    - name: "判定"
      body: "與以校準良品凍結的門檻值比較：送複檢或不送複檢。"
      code: "calibration.py"
  roi_title: "影像 ROI——感興趣區域（Region of Interest）"
  roi_body: "取分數的影像範圍。v2 在電路板區域內取異常值的最大值；這個區域由無瑕疵的訓練影像建立，再向外擴 {{ f.pcb2.v2.roi_margin_px }} 個像素。若某張影像本身的電路板遮罩只有不到 {{ f.pcb2.v2.coverage_min }} 落在區域內，系統就不信任這個區域，改用整張畫面計分——這只會提高送人工複檢的機率。"
  harness_title: "評估工具"
  harness_body: "單一命令列工具依序執行每個步驟——prepare、split、fit、calibrate（寫入凍結紀錄）、evaluate、robustness、compare、check。若模型、設定或資料切分與已提交的凍結紀錄不一致，<code>evaluate</code> 會拒絕執行；任何報告數字若無法追溯到實際紀錄的輸出，<code>check</code> 就會失敗。"

results:
  title: "受控實驗與結果"
  intro: "每項受控變更都事前登錄：在開啟測試資料前，先提交假設、資料切分、指標與決策規則；門檻值以另一批良品影像凍結；只評估一次。v2 只改了一件事——在電路板區域內計分——並在開發時未使用的板型 PCB2 上確認。"
  so: "因此："
  findings:
    - tag: "PCB2"
      status: measured
      title: "電路板區域計分降低了誤報"
      body: "在開發時未使用的板型上，測試誤報率從 {{ f.pcb2.v1.fpr.pct }} 降到 {{ f.pcb2.v2.fpr.pct }}（{{ f.pcb2.paired.fpr_test.delta }} 個百分點，信賴區間 {{ f.pcb2.paired.fpr_test.ci_low }} 至 {{ f.pcb2.paired.fpr_test.ci_high }}）；AUROC 從 {{ f.pcb2.v1.auroc.fmt }} 提高到 {{ f.pcb2.v2.auroc.fmt }}。"
      so: "這項變更確實解決了它鎖定的問題。"
    - tag: "PCB2"
      status: measured
      title: "瑕疵檢出率沒有提升"
      body: "兩個版本都抓到 {{ f.pcb2.v2.recall.pct }} 的瑕疵，未達提議的 {{ f.criteria.recall_min }}；事前登錄的檢出率假設未獲支持。面積最小的三分之一瑕疵：{{ f.pcb2.small.recall }}（{{ f.pcb2.small.frac }}）。"
      so: "目前的瓶頸是檢出能力，而不是誤報。"
    - tag: "PCB2"
      status: measured
      title: "影像變暗會讓操作點失準"
      body: "將每張影像調暗 {{ f.pcb2.dark_pct }} 並降低對比後，v2 的誤報率從 {{ f.pcb2.dark.v2.clean }} 升到 {{ f.pcb2.dark.v2.dark }}；調亮則沒有這個問題。"
      so: "進入產線試行之前，必須先控制或校正光照，而且校正本身也要經過驗證。這促成了 PCB3 實驗。"

boards:
  title: "各板型結果——彼此獨立的資料集"
  intro: "PCB1、PCB2、PCB3 是不同的板型，各有自己擬合的模型、電路板區域與凍結門檻值。不同板型之間的數字不是對照比較，也不代表隨時間進步；只有同一板型內的列才是成對比較。"
  cols: ["板型", "版本／組別", "證據性質", "瑕疵檢出率（官方測試集）", "{{ f.ci_level }} 信賴區間", "誤報率（測試良品）", "誤報率（保留良品）", "AUROC"]
  rows:
    pcb1_v1:
      version: "v1（原始流程）"
      evidence: "開發用板型；v2 的構想來源"
    pcb1_v2_retro:
      version: "v2，回溯分析"
      evidence: "事後分析，使用啟發 v2 的同一批資料——不是獨立證據"
    pcb2_v1:
      version: "v1"
      evidence: "確認性測試，開發時未使用的板型"
    pcb2_v2:
      version: "v2"
      evidence: "確認性測試，開發時未使用的板型——受控的 v1／v2 比較"
    pcb3_base:
      version: "v2 流程——光照實驗的對照組"
      evidence: "確認性測試，新板型；不是新的模型版本"
    pcb3_cand:
      version: "v2＋光照校正——候選組"
      evidence: "確認性測試，新板型；不予採用"
  note: "每個瑕疵檢出率都只量測了 {{ f.pcb3.result.n_anom }} 張基準資料集的瑕疵影像，因此有數個百分點的不確定性（見信賴區間）。PCB3 對照組的 {{ f.pcb3.result.recall.base }} 是單一板型上的基準量測值，不代表實際產線上可預期的檢出率。"

pcb3:
  title: "PCB3：事前登錄的光照校正實驗"
  intro: "PCB2 顯示，影像變暗 {{ f.pcb2.dark_pct }} 會讓誤報率上升 {{ f.pcb2.dark.v2.rise }} 個百分點。這項實驗在從未使用過的板型上測試一個候選修正：實驗計畫在開啟資料前就已提交，而且只評估一次。一句話總結：修正做到了設計上要做的事，但它要解決的問題在 PCB3 上幾乎沒有出現，同時還帶來了新的弱點。"
  design_title: "實驗設計（開啟 PCB3 資料前就已固定）"
  design:
    - "只改一件事：在影像對位前，把每張影像的整體亮度與對比標準化到訓練影像的中位數，三個色彩通道使用同一個增益。"
    - "對照組＝v2 流程；候選組＝v2 加上校正。兩組使用同一批影像、各自的門檻值，各以 {{ f.pcb3.split.calib }} 張另外的良品影像凍結。"
    - "主要指標：整體變暗（G1）造成的誤報率上升幅度，在兩組之間的差異中的差異（DiD）；以 {{ f.pcb3.split.test_normal }} 張測試良品＋{{ f.pcb3.split.holdout }} 張保留良品計算，採成對 bootstrap。"
    - "把關條件：未加擾動時的瑕疵檢出率與誤報率，不得惡化超過事先訂定的容許範圍。非均勻光照（N1）用來測試校正模型能處理的範圍以外的情況。"
    - "事先已知：G1 是整體性的變化，校正幾乎「依定義」就能還原它。G1 結果好，並不代表對真實光照變化具有穩健性。"
  result_title: "結果（唯一一次計畫內執行）"
  decisions_title: "兩個決策，分開陳述"
  decision_a_label: "A · 事前登錄的實驗結果"
  decision_a: "<strong>{{ f.pcb3.result.outcome }}</strong>——完全依凍結的規則計算，在 PCB3 上屬於<strong>弱證據</strong>。它只表示：在合成的整體變暗下，候選組的誤報率上升幅度小於對照組（{{ f.pcb3.result.cond.G1.fpr.d_cand }} 對 {{ f.pcb3.result.cond.G1.fpr.d_base }} 個百分點；差異 {{ f.pcb3.result.cond.G1.fpr.did }}，信賴區間 {{ f.pcb3.result.cond.G1.fpr.ci_low }} 至 {{ f.pcb3.result.cond.G1.fpr.ci_high }}）。對照組本身的上升幅度，低於實驗計畫事先訂定、足以構成有效檢驗的門檻。"
  decision_b_label: "B · 工程採用決策"
  decision_b: "<strong>不採用光照校正作為首選流程。</strong>它降低了影像變亮時的誤報率上升（{{ f.pcb3.detail.cond.B1.base.rise }} → {{ f.pcb3.detail.cond.B1.cand.rise }} 個百分點），卻讓輕微模糊時的誤報率上升 {{ f.pcb3.detail.cond.blur.cand.rise }} 個百分點（誤報良品 {{ f.pcb3.detail.cond.P0.cand.fp }} → {{ f.pcb3.detail.cond.blur.cand.fp }} 張；對照組 {{ f.pcb3.detail.cond.blur.base.rise }}），超過原本 {{ f.criteria.rob_pts }} 個百分點的上限。"
  baseline_note: "否決候選組，不等於核准對照組。對照組同樣未通過穩健性標準（影像變亮時上升 {{ f.pcb3.detail.cond.B1.base.rise }} 個百分點），而且兩組都沒有經過真實使用者驗證、工廠試行，也沒有實際量測的營運效益。"
  col_cond: "條件"
  col_abs: "誤報率（誤報數／未見過的良品數）"
  col_change: "相對未擾動的變化（百分點）"
  col_base: "對照組"
  col_cand: "候選組"
  cond_names:
    P0: "未擾動（P0）"
    G1: "整體變暗（G1）"
    B1: "調亮（B1）"
    N1: "非均勻光照（N1）"
    blur: "輕微模糊"
    shift: "位移"
  table:
    - pid: "P0"
      hint: "無擾動"
    - pid: "G1"
      hint: "主要指標"
    - pid: "B1"
      hint: "次要指標；反方向"
    - pid: "N1"
      hint: "次要指標；校正範圍以外的限制測試"
    - pid: "blur"
      hint: "僅用於驗收檢查，不是比較指標"
    - pid: "shift"
      hint: "僅用於驗收檢查，不是比較指標"
  recall_label: "未擾動時的瑕疵檢出率"
  recall_hint: "抓到的瑕疵／官方測試集瑕疵品"
  table_note: "{{ f.pcb3.result.n_pooled }} 張未見過的良品影像（官方測試集 {{ f.pcb3.result.n_test_normal }} 張＋補充保留集 {{ f.pcb3.result.n_holdout }} 張），兩組各用自己凍結的門檻值。絕對誤報率與變化量分欄呈現：變化量是同一批影像上兩個絕對誤報率的差。完整分析與程式化重算見儲存庫。"
  acc_title: "原始驗收標準（未修改）——兩組"
  acc_cols: ["標準", "對照組", "候選組"]
  acc_rows:
    recall: "瑕疵檢出率 ≥ {{ f.criteria.recall_min }}（官方測試集）"
    fpr_test: "誤報率 ≤ {{ f.criteria.fpr_max }}，官方測試集良品"
    fpr_holdout: "誤報率 ≤ {{ f.criteria.fpr_max }}，保留良品"
    auroc: "AUROC ≥ {{ f.criteria.auroc_min }}"
    latency: "延遲中位數 ≤ {{ f.criteria.latency_max }}"
    robustness: "穩健性：任何擾動造成的誤報率上升都不超過 {{ f.criteria.rob_pts }} 個百分點（G1、B1、模糊、位移）"
  met: "達成"
  not_met: "未達成"
  verdict: "判定"
  pts_unit: "個百分點"
  acc_note: "INCONCLUSIVE 表示沒有觸發任何 No-Go 規則，但並非所有標準都已達成；這不是核准。瑕疵檢出率僅以 {{ f.pcb3.result.n_anom }} 張影像的點估計值達標。"
  interp_title: "如何解讀"
  interp:
    - letter: "A"
      q: "校正是否解決了整體變暗的問題？"
      a: "就它能處理的範圍而言，是的：變暗時候選組上升 {{ f.pcb3.result.cond.G1.fpr.d_cand }} 個百分點，對照組 {{ f.pcb3.result.cond.G1.fpr.d_base }}（差異 {{ f.pcb3.result.cond.G1.fpr.did }} 個百分點，信賴區間 {{ f.pcb3.result.cond.G1.fpr.ci_low }} 至 {{ f.pcb3.result.cond.G1.fpr.ci_high }}）。但對照組的上升幅度低於事先訂定、足以構成有效檢驗的門檻；而整體變暗正好是整體校正能還原的情況。這不能證明對真實光照具有穩健性。"
    - letter: "B"
      q: "影像對位與電路板分割是否變得更穩定？"
      a: "很可能是效果的一部分。在訓練影像上，變暗讓對照組估計的電路板位置偏移 {{ f.pcb3.diag.base_G1.warp_median }} 像素（中位數），候選組只有 {{ f.pcb3.diag.cand_G1.warp_median }} 像素；改用全畫面計分的備援次數為 {{ f.pcb3.diag.base_G1.fallback }} 次對 {{ f.pcb3.diag.cand_G1.fallback }} 次。本實驗無法區分影像對位與特徵本身的效果，因此不主張兩者各佔多少。"
    - letter: "C"
      q: "異常分數的表現是否改善？"
      a: "未擾動時沒有變化（AUROC {{ f.pcb3.result.auroc.base }} → {{ f.pcb3.result.auroc.cand }}；瑕疵檢出率 {{ f.pcb3.result.recall.base }} → {{ f.pcb3.result.recall.cand }}）。影像變亮時，上升幅度 {{ f.pcb3.result.cond.B1.fpr.d_base }} → {{ f.pcb3.result.cond.B1.fpr.d_cand }} 個百分點。但在輕微模糊下，候選組的誤報率上升 {{ f.pcb3.result.blur.cand.rise }} 個百分點（{{ f.pcb3.result.blur.cand.clean_frac }} → {{ f.pcb3.result.blur.cand.frac }}），對照組只有 {{ f.pcb3.result.blur.base.rise }}——這是計畫外的觀察；可能的原因是模糊降低了整體對比，校正又把它拉高。"
    - letter: "D"
      q: "非均勻光照下還有什麼問題？"
      a: "沒有改善：差異 {{ f.pcb3.result.cond.N1.fpr.did }} 個百分點（信賴區間 {{ f.pcb3.result.cond.N1.fpr.ci_low }} 至 {{ f.pcb3.result.cond.N1.fpr.ci_high }}）。兩組在 PCB3 上的上升幅度都很小，因此沒有觸發限制規則；但正如測試前所述，整體校正無法處理光照的空間梯度。"
    - letter: "E"
      q: "可以進入產線試行了嗎？"
      a: "還不行。依未修改的驗收標準，兩組都是 {{ f.pcb3.result.verdict.cand }}：PCB3 未擾動時的目標都已達成，但兩組都未通過穩健性標準（對照組在影像變亮時、候選組在模糊時）。校正也增加了延遲（中位數 {{ f.pcb3.result.latency.base }} → {{ f.pcb3.result.latency.cand }} 毫秒）。所有擾動都是合成的。候選組不予採用，對照組也還不具備上線條件。"
  fig_roi_alt: "PCB3 訓練影像對位後的平均影像，標出電路板區域各建構階段的輪廓；另有三張個別影像，以洋紅色標出電路板區域內的布面。"
  fig_roi_caption: "僅使用訓練影像。電路板區域（佔畫面 {{ f.pcb3.diag.roi_area }}）涵蓋電路板、排針與 LED，但其中約 {{ f.pcb3.diag.roi_cloth }} 的像素是布面（洋紅色）。顏色分類屬經驗法則。VisA 影像，CC BY 4.0，經對位、裁切並加上疊圖。"
  deviation: "已揭露的偏差：實驗計畫要求 PCB3 電路板遮罩的調整（附錄 B1）必須在模型擬合前提交；它在擬合前就已決定，但實際上是兩個模型擬合完成約五分鐘後才提交。當時沒有任何校準或測試影像被計分。相關診斷與這項揭露（附錄 B2）在校準前就已提交。"

repair:
  title: "技術揭露：PCB3 測試後的分析程式修正"
  intro: "PCB3 測試影像與保留影像各計分一次之後，事前登錄的成對分析程式拒絕執行，其中一項輸入檢查因此被修正。所以產生 PCB3 結果的分析程式，與凍結時的版本並不完全相同。此處沒有任何回溯補填的日期。"
  col_time: "時間"
  col_event: "事件"
  events:
    - time: "{{ f.repair.freeze_time }}"
      what: "提交凍結紀錄（{{ f.repair.freeze_sha }}）：門檻值、設定檔、資料切分與原始碼"
    - time: "{{ f.repair.eval_start }}–{{ f.repair.eval_end }}"
      what: "兩組唯一一次計畫內評估。此後沒有任何 PCB3 測試或保留影像再被計分。"
    - time: "{{ f.repair.refusal1 }}、{{ f.repair.refusal2 }}"
      what: "在程式未變更的情況下，成對分析兩度拒絕執行：輸入檢查要求標籤為「anomaly」，但 VisA 記錄的是瑕疵類型（bent、melt、scratch、missing）。"
    - time: "{{ f.repair.fix_time }}"
      what: "修正該檢查（{{ f.repair.fix_sha }}）。當時已在評估主控台上看過測試的摘要指標。"
    - time: "{{ f.repair.analysis_time }}"
      what: "成對分析完成並提交（{{ f.repair.analysis_sha }}）。"
  changed_title: "改了什麼"
  changed: "讀取瑕疵標註遮罩的函式中的一個條件；這個函式只用於描述性的小型／低對比瑕疵統計表。修正前這張表無法產生；它的計算方式沒有改變。"
  unchanged_title: "沒有改變的部分"
  unchanged: "模型擬合、前處理、門檻值、測試分數、預測結果、主要統計量與判定規則。沒有任何影像被重新計分，測試也沒有重做。"
  verify_title: "程式化交叉核對"
  verify: "另一支完全不引用專案程式碼的腳本，從原始分數檔與原始遮罩重新計算 PCB3 的每個數字：{{ f.repair.checks_total }} 項檢查中有 {{ f.repair.checks_ok }} 項與紀錄的輸出一致。"
  where: "完整事件紀錄（時序、確切修改內容、檔案雜湊值、偏差）見儲存庫 <code>{{ f.repair.doc }}</code>；所有測試後事件見 <code>{{ f.repair.deviations }}</code>；重算結果見 <code>{{ f.repair.recompute_doc }}</code>。時間為 {{ f.repair.date }}，台灣時間。"

lessons:
  title: "失敗調查與教訓"
  intro: "哪裡出了問題、如何發現、改變了什麼。其中最有價值的兩項發現，都是沒有發出任何錯誤訊息的失效。"
  so: "因此："
  items:
    - tag: "PCB3"
      status: demonstrated
      title: "電路板分割預設背景是灰色"
      body: "PCB3 的背景是高飽和度的綠色布面，原本的顏色規則把每張影像的 {{ f.pcb3_mask.original }} 都判為電路板，影像對位因此失效，卻沒有發出任何錯誤訊息。改用從訓練影像量測出的色相範圍排除背景後，電路板遮罩恢復為 {{ f.pcb3_mask.adapted }}。"
      so: "依賴背景的前處理，必須在每個廠區重新驗證；這次它是在毫無警示的情況下失效。"
    - tag: "PCB3"
      status: demonstrated
      title: "影像對位與電路板區域只能大致移植"
      body: "未校正時，影像變暗 {{ f.pcb2.dark_pct }} 會讓訓練影像上估計的電路板位置偏移 {{ f.pcb3.diag.base_G1.warp_median }} 像素（中位數）。電路板區域佔畫面的 {{ f.pcb3.diag.roi_area }}，其中約 {{ f.pcb3.diag.roi_cloth }} 的像素其實是布面。"
      so: "靠近板邊的棉絮仍可能引發誤報（見下方錯誤範例）；位置估計也會受亮度影響。"
    - tag: "PCB3"
      status: measured
      title: "一項修正把一種敏感度換成另一種"
      body: "光照校正消除了大部分對影像變亮的敏感度，卻讓輕微模糊時的誤報率上升 {{ f.pcb3.result.blur.cand.rise }} 個百分點（對照組 {{ f.pcb3.result.blur.base.rise }}）。"
      so: "任何修正都必須以完整的擾動組合檢查，而不只檢查它鎖定的那一種。"
  fig_mask_alt: "同一張 PCB3 訓練影像的三個畫面：原始照片；原本的電路板遮罩以洋紅色幾乎蓋滿整個畫面；調整後的遮罩只覆蓋電路板。"
  fig_mask_caption: "PCB3 訓練影像：原圖 · 原本的顏色規則（洋紅色＝判為電路板，佔畫面 {{ f.pcb3_mask.original }}）· 加入色相範圍排除後（{{ f.pcb3_mask.adapted }}）。數值為 {{ f.pcb3_mask.n_fit }} 張訓練影像的中位數。VisA 影像，CC BY 4.0，經縮放並加上疊圖。"
  takeaways_title: "帶往下一步的教訓"
  takeaways:
    - "沒有警示的失效代價最高：前處理需要檢查輸出（遮罩面積、覆蓋率、備援比例），而不只是確認程式有跑完。"
    - "一次只改一件事，並在開啟資料前固定分析方法；計畫出問題時，揭露變更，而不是改寫紀錄。"
    - "把實驗判定與工程決策分開：規則可以判定「支持」，但變更仍可能不予採用。"
    - "以一百張基準瑕疵影像量測的檢出率，有數個百分點的不確定性；要報告信賴區間，並依瑕疵大小分別報告檢出率。"

workflow:
  title: "凍結門檻值下的錯誤範例"
  intro: "三張真實的 PCB2 v2 測試輸出——抓到的瑕疵、一次誤報、一次漏檢——以複檢人員可能看到的卡片呈現：熱圖、與凍結門檻值比較的分數，以及電路板是否定位成功的檢查。"
  banner: "以實際紀錄的輸出製作的示意卡片——不是已上線的系統。工具只建議是否送複檢，最後由人判定。"
  fields:
    score: "異常分數"
    threshold: "凍結門檻值（P95）"
    coverage: "電路板定位（ROI 覆蓋率）"
    truth: "基準資料集標籤"
  decision:
    REVIEW: "送複檢"
    NO_REVIEW: "不送複檢"
  truth:
    anomaly: "瑕疵品"
    normal: "良品"
  action_label: "複檢人員動作："
  cases:
    caught:
      title: "抓到瑕疵"
      body: "熱圖集中在彎曲的排針上，分數遠高於門檻值。"
      action: "檢查排針，並記錄瑕疵類型。"
      alt: "排針彎曲的 PCB2 電路板，熱圖標示出排針位置。"
    false_alarm:
      title: "誤報"
      body: "這是良品。異常最高點落在電路板區域外擴邊界內、布面上的一個痕跡——正是診斷中發現的區域限制。"
      action: "確認沒有瑕疵，並把原因標記為「背景」，以便追蹤誤報來源。"
      alt: "PCB2 良品電路板，唯一被標示的點位於電路板左下角附近的背景布面上。"
    missed:
      title: "已知限制：漏檢"
      body: "排針旁的一個小瑕疵分數低於門檻值，所以系統沒有建議複檢。青色輪廓是基準資料集的標準答案，這裡只用來說明漏檢原因。"
      action: "系統不會提示。小型瑕疵需要其他防線，例如抽樣稽核。"
      alt: "PCB2 電路板，排針旁的小瑕疵以青色輪廓標出，沒有出現熱圖。"
  footnote: "綠色虛線：計分區域。熱圖：平滑後的異常分數，只顯示高於校準良品中位數的部分。分數是官方測試集的紀錄值；門檻值是測試前凍結的那一個。VisA 影像（CC BY 4.0），經對位、裁切、縮放並加上疊圖。"

engineering:
  title: "工程紀律：讓別人也能接手"
  intro: "如果由另一位工程師接手，這個專案如何維持可理解、可重現、可安全修改。每項做法都依實際狀態標示：已在本儲存庫示範、提議作為團隊做法，或尚未實作。路徑指專案儲存庫中的檔案。"
  evidence_label: "證據"
  principles:
    - letter: "A"
      title: "清楚的負責人與可追溯性"
      lead: "任何人都能查到某件事為何這樣決定、由誰負責。"
      items:
        - status: demonstrated
          text: "需求與驗收目標都是版本化的檔案；看到結果後，目標從未修改。"
          files: [requirements, acceptance]
        - status: demonstrated
          text: "技術決策連同理由，以及被否決的替代方案，都有紀錄。"
          files: [decisions, decision_record]
        - status: demonstrated
          text: "每項實驗都在開啟測試資料前提交實驗計畫；里程碑可追溯到 commit。"
          files: [prereg_scoring, prereg_lighting, milestones]
        - status: proposed
          text: "為設定檔、驗收目標與操作門檻值指定負責人。角色已定義，但尚未指派任何人。"
          files: [handoff]
    - letter: "B"
      title: "受控的變更"
      lead: "任何會影響結果的東西，都不會在無聲無息中改變。"
      items:
        - status: demonstrated
          text: "每個版本或實驗只做一項受控變更，並在同一批影像上與未變更的流程比較。"
          files: [decision_record, prereg_lighting]
        - status: demonstrated
          text: "設定檔與門檻值有版本管理，並在凍結時計算雜湊值；模型、設定或資料切分有變更，或凍結紀錄未提交時，評估會拒絕執行。"
          files: [config_v2, freeze_v2, pipeline]
        - status: demonstrated
          text: "與實驗計畫的偏差都附時間戳記錄並揭露，從不回溯補填。"
          files: [deviations, repair]
        - status: proposed
          text: "每項變更都經過人工同儕審查；阻擋性的審查意見綁定在提出時的確切 commit 上，只有在新 commit 重新審查後才算解除。"
          files: []
        - status: not_impl
          text: "尚未進行人工同儕審查：目前的檢查是程式化的與 AI 輔助的，專案負責人的審閱尚未完成。"
          files: []
    - letter: "C"
      title: "自動化品質關卡"
      lead: "主張由程式檢查，而不是靠人閱讀。"
      items:
        - status: demonstrated
          text: "單元、整合與合成資料端對端測試，也涵蓋網站與 PDF 的建置。"
          files: [tests]
        - status: demonstrated
          text: "資料洩漏防護：以檔案雜湊值稽核資料切分；門檻值只用校準良品設定；測試影像只計分一次。"
          files: [split_audit, data]
        - status: demonstrated
          text: "數值一致性：每個報告數字都能追溯到實際紀錄的輸出；另一支腳本不使用專案程式碼，重新計算 PCB3 的數字。"
          files: [consistency, recompute]
        - status: demonstrated
          text: "可重現的環境：鎖定相依套件版本；在乾淨環境中重跑 PCB1 v1，結果逐位元組相同。"
          files: [lock, handoff]
        - status: not_impl
          text: "持續整合：這些關卡目前在本機執行；尚未有伺服器在每次變更時自動執行。"
          files: []
    - letter: "D"
      title: "可維護性與交接"
      lead: "下一位工程師能執行、除錯並回滾。"
      items:
        - status: demonstrated
          text: "交接文件：如何執行與重現、設定檔負責人、已知失效模式、維運注意事項。"
          files: [handoff]
        - status: demonstrated
          text: "程式內建的安全機制：找不到電路板就報錯；電路板區域不可信時，改用較保守的全畫面分數。"
          files: [align, roi]
        - status: proposed
          text: "監控送複檢比例、備援比例與亮度漂移；可回滾到上一版模型與門檻值（每份凍結紀錄都會保留）。"
          files: [handoff]
        - status: not_impl
          text: "產線運作手冊、工廠監控與事件處理：都還沒有在任何地方實際運作過。"
          files: []

dates:
  title: "可查證的里程碑"
  events:
    poc: "PCB1 概念驗證：可運作的原型、凍結的資料切分、測試、v1 評估"
    pcb2: "v2 於取用 PCB2 資料前事前登錄；凍結門檻值；只做一次確認性評估"
    pcb3: "PCB3 光照實驗事前登錄、凍結、只評估一次；成對分析"
    audit: "AI 輔助技術交叉檢查與獨立數值重算"
    owner_review: "專案負責人的技術審閱與驗收"
  pending: "待完成"
  note: "日期為開發用儲存庫的 commit 日期（台灣時間）；AI 輔助交叉檢查的日期為其結論記錄的日期，並非人工簽核。第一個 commit 已包含可運作的原型；更早的本機作業沒有獨立的時間紀錄，因此不主張任何總交付時間。精確的 commit 時間與雜湊值保留在儲存庫的稽核紀錄中。"

readiness:
  title: "技術成熟度與 AI 工程交接"
  intro: "技術可行性已在公開資料上示範；進一步的真實環境驗證屬於提議；目前還不足以支持任何會影響生產的使用。"
  cols:
    - kind: demonstrated
      title: "以公開基準影像驗證技術可行性"
      items:
        - "只用良品的偵測器、影像對位、電路板區域計分：已實作，並有單元測試。"
        - "PCB2 確認性測試：誤報率 {{ f.pcb2.v1.fpr.pct }} → {{ f.pcb2.v2.fpr.pct }}，兩個版本的瑕疵檢出率都是 {{ f.pcb2.v2.recall.pct }}。"
        - "在凍結門檻值下，量測對合成光照、模糊與位移的穩健性。"
        - "PCB3 事前登錄的光照校正實驗，只執行一次；該校正不予採用。"
    - kind: proposed
      title: "真實環境驗證"
      items:
        - "由品質負責人確認廠區需求：必須抓到的瑕疵類型與尺寸、複檢人力、漏檢與複檢的成本比。"
        - "以影子模式在實際產線影像上執行，不影響任何判定。"
        - "在工具影響任何判定之前，先通過下方的廠區檢查作為進場門檻。"
        - "依這些證據再做一次 Go / No-Go 判斷。"
    - kind: not_validated
      title: "超出本專案能證明的範圍"
      items:
        - "任何工廠影像、相機、光源、產線節拍或實際瑕疵組成。"
        - "複檢介面的易用性，以及複檢人員之間的判定一致性。"
        - "人力節省或財務報酬。"
        - "對真實（非合成）光照變化的穩健性。"
  risks_title: "仍存在的技術風險"
  risks:
    - "檢出能力：PCB2 瑕疵檢出率 {{ f.pcb2.v2.recall.pct }}，未達提議的 {{ f.criteria.recall_min }}；面積最小的三分之一瑕疵只有 {{ f.pcb2.small.recall }}。"
    - "光照穩健性：影像變暗 {{ f.pcb2.dark_pct }} 時，PCB2 誤報率上升 {{ f.pcb2.dark.v2.rise }} 個百分點；影像變亮時，PCB3 誤報率上升 {{ f.pcb3.detail.cond.B1.base.rise }} 個百分點。"
    - "可移植性：背景換成綠色布面後，原本的電路板分割規則把畫面的 {{ f.pcb3_mask.original }} 都當成電路板。"

sites:
  title: "新廠區或新產線必須證明什麼"
  intro: "PCB1、PCB2、PCB3 是公開資料集中的板型，不是製造廠區。但它們具體顯示出：條件一改變，哪些假設就會失效。"
  cols: ["風險", "本專案觀察到的現象", "新廠區必須提供或通過的項目"]
  rows:
    - risk: "依賴背景的電路板分割"
      seen: "灰色布面沒有問題；PCB3 的綠色布面讓原本的規則把畫面的 {{ f.pcb3_mask.original }} 當成電路板，而且沒有任何錯誤訊息。"
      need: "以該廠區自己的良品影像做分割檢查：電路板遮罩面積落在預期範圍內，並由人員目視確認縮圖總表。"
    - risk: "光照穩健性"
      seen: "影像變暗 {{ f.pcb2.dark_pct }} 時，PCB2 誤報率上升 {{ f.pcb2.dark.v2.rise }} 個百分點；在 PCB3 上，亮度變化也會讓估計的電路板位置偏移。"
      need: "光源規格，以及每張影像的亮度／對比檢查；並在該廠區凍結的門檻值下做擾動測試。"
    - risk: "方向與擺放"
      seen: "PCB1 有 {{ f.pcb1.rotated_180_pct }} 的電路板旋轉了半圈；每種板型的擺放位置都有差異。"
      need: "治具或影像對位驗收：該廠區良品的位置分布，以及在已標註樣本上沒有方向判斷錯誤。"
    - risk: "ROI 相容性"
      seen: "PCB3 的電路板區域佔畫面 {{ f.pcb3.diag.roi_area }}，其中約 {{ f.pcb3.diag.roi_cloth }} 是布面；誤報可能源自電路板附近的布面。"
      need: "以該廠區自己的良品建立區域、覆蓋率檢查通過，且校準影像上改用全畫面計分的備援比例低於議定上限。"
    - risk: "小型與低對比瑕疵"
      seen: "PCB2 面積最小的三分之一瑕疵，檢出率只有 {{ f.pcb2.small.recall }}。"
      need: "該廠區實際瑕疵組成的已標註樣本；依尺寸分級回報瑕疵檢出率，而不只是整體數字。"
    - risk: "廠區專屬資料與校準"
      seen: "每一種板型都需要自己擬合的模型、電路板區域與門檻值。"
      need: "足夠擬合用的良品影像、另一組校準用影像，以及一組調整期間團隊從不查看的保留集。"
    - risk: "門檻值與模型版本管理"
      seen: "凍結後若模型、設定或資料切分有變更，或凍結紀錄未提交，評估就會拒絕執行。"
      need: "模型、門檻值、設定檔一起版本化發布；任何變更都要重新校準並執行回歸測試。"

handoff:
  title: "AI 工程團隊實作時需要的東西"
  intro: "內容記錄在儲存庫的交接文件中；都還沒有在產線上實際運作過。"
  items:
    - title: "相機與輸入規格"
      body: "每張影像一片電路板的 RGB 影像，固定的俯拍相機，板型與背景必須和建立模型時相同。其他輸入不在適用範圍內。"
    - title: "輸入品質檢查"
      body: "提議：把每張影像的亮度、對比與清晰度和訓練範圍比較，超出範圍就送複檢——因為實測顯示影像變暗時誤報會急遽上升。"
    - title: "影像對位與 ROI 可靠度"
      body: "找不到電路板時會直接報錯，絕不默默放行。若電路板遮罩不在電路板區域內，就改用整張畫面的分數（較保守）。備援比例是監控項目；校準時超過上限就停止。"
    - title: "模型與門檻值版本管理"
      body: "凍結時對模型、門檻值、設定與資料切分計算雜湊值；不一致時評估會拒絕執行。每次發布都附上凍結紀錄。"
    - title: "廠區專屬評估"
      body: "每一種新板型、背景、相機或光源，都要以自己的資料擬合、校準與評估，並保留一組沒有人用來調整的保留集。"
    - title: "監控與回歸測試"
      body: "每個班次追蹤送複檢比例、備援比例、亮度漂移，以及經人員確認的誤報。每次變更都重跑單元、端對端與一致性測試。"
    - title: "回滾與事件處理"
      body: "保留上一版模型與門檻值，隨時可重新部署；送複檢比例或備援比例觸發警報時就回滾，再離線重新校準。工具只提供建議；不明確的案例與任何疑似系統性漏檢，都要上報品質負責人。"
    - title: "交接文件"
      body: "如何執行與重現、已知失效模式、設定檔負責人與授權注意事項，都記錄在儲存庫的交接文件中。"

cost:
  title: "複檢成本敏感度——不是財務投資報酬率"
  body: "沒有量測任何投資報酬率，而沒有量測報酬，並不代表報酬為負。目前資料能支持的，只是簡化的分類成本敏感度分析。令 k ＝ 瑕疵勝算 ×（漏掉一件瑕疵的成本 ÷ 複檢一張影像的成本）。以 PCB2 v2 實測的漏檢率 {{ f.cost.v2.miss }} 與誤報率 {{ f.cost.v2.fpr }} 計算，成本最低的做法是："
  col_policy: "做法"
  col_when: "成本最低的條件"
  policies:
    - policy: "全部不複檢"
      when: "k 小於 {{ f.cost.v2.k_low_fmt }}"
    - policy: "只複檢 v2 標記的影像"
      when: "k 介於 {{ f.cost.v2.k_low_fmt }} 與 {{ f.cost.v2.k_high_fmt }} 之間"
    - policy: "全部複檢"
      when: "k 大於 {{ f.cost.v2.k_high_fmt }}"
  caution: "這裡只比較分類錯誤的成本，沒有計入複檢時間、產線節拍、流到下游的漏檢、人力配置與導入成本；k 也必須來自使用者自己的不良率與成本。不主張任何人力節省。"

terms:
  title: "本頁使用的名詞"
  items:
    - term: "瑕疵檢出率（Recall）"
      def: "瑕疵品被工具送人工複檢的比例。"
    - term: "誤報率（False-alarm rate）"
      def: "良品被工具送人工複檢的比例。工具只建議複檢，所以誤報的代價是複檢人員的時間，而不是產品本身。"
    - term: "AUROC"
      def: "與門檻值無關的排序品質：隨機挑一張瑕疵品與一張良品，瑕疵品分數較高的機率。"
    - term: "凍結門檻值（P95）"
      def: "分數超過此值就標記送複檢；以另一批良品影像設定，目標誤報率約 {{ f.target_fpr }}，並在任何測試影像計分前固定。"
    - term: "事前登錄（Pre-registration）"
      def: "在開啟測試資料之前，就把假設、資料切分、指標與決策規則寫進儲存庫。"
    - term: "差異中的差異（DiD）"
      def: "在同一批影像上，候選組的誤報率上升幅度比對照組少（或多）多少。"
    - term: "影子模式（Shadow mode）"
      def: "讓工具與現有檢驗流程並行運作，但不影響任何判定，藉此在真實產線影像上量測表現。"
    - term: "交叉驗證外折（Out-of-fold）"
      def: "在交叉驗證中，影像的分數由沒有用它訓練的那個模型給出。"

