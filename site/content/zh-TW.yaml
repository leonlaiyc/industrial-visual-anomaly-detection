# 繁體中文內容（與 en.yaml 鍵值完全相同）。技術案例研究結構：1 問題 · 2 資料 · 3 方法 · 4 架構 · 5 實驗 · 6 失敗與教訓 · 7 工程紀律 · 8 成熟度與交接。
# 所有數字一律以 {{ f.* }} 引用 site/data/facts.json，
# 內文出現數字字面值時 `python site/build.py` 會直接失敗。
# 用語：人工複檢、瑕疵檢出率、誤報率、影像對位、光照穩健性、產線試行；實驗的 baseline 一律稱「對照組」，
# 以免與「基準資料集」（benchmark）混淆。工具只建議送人工複檢，不做判退，因此不使用「過殺」。

