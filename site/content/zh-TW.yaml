terms:
  title: "本頁用語"
  items:
    - term: "檢出率（recall）"
      def: "瑕疵板中，被工具送去人工複判的比例。漏掉的瑕疵，指工具沒有標記的瑕疵板。"
    - term: "誤報率（false-alarm rate）"
      def: "良品板中，被工具送去複判的比例。工具只建議複判，不會判退件或報廢，因此誤報的代價是複判人力，不是產品；本頁因此不用「過殺」一詞。"
    - term: "AUROC"
      def: "不依賴門檻值的排序能力：隨機取一片瑕疵板與一片良品板，瑕疵板分數較高的機率。"
    - term: "凍結門檻值（P95）"
      def: "影像分數超過此值就標記。以另一批良品影像設定，目標誤報約 {{ f.target_fpr }}，並在任何測試影像計分之前固定。"
    - term: "事先登錄（pre-registration）"
      def: "在開啟測試資料前，就把假設、資料切分、主要指標與判定規則提交到版本庫，結果無法回頭影響分析方式。"
    - term: "影子模式（shadow mode）"
      def: "工具與現行檢驗並行運作，但不影響任何判定，用來在真實產線影像上量測表現。"

path:
  title: "交付流程"
  intro: "七個階段，以及本專案在每個階段實際做到哪裡。第二、三階段在測試前只以提案形式寫成；在真實專案中，這兩步應該最先、與使用者一起完成。"
  phase_a: "第一階段 · 已完成的技術可行性驗證"
  phase_b: "第二階段 · 提議的營運驗證"
  stages:
    - name: "理解問題"
      evidence: "只用訓練影像檢查板件姿態、光線與背景；因瑕疵稀少且型態多變，選擇單類別學習。"
    - name: "需求與決策價值"
      evidence: "提議的目標與 Go/No-Go 規則在任何測試前固定；成本敏感度分析為事後補做，兩者都尚未經使用者確認。"
    - name: "需求一次到位（First-Time-Right）"
      evidence: "以真實模型輸出製作提議的複判流程與介面示意，附上一份待真實使用者確認的驗收清單。"
    - name: "模型選擇與實作"
      evidence: "凍結特徵＋馬氏距離偵測器，已實作並有單元測試；依標註需求、訓練目標與成本比較其他方案。"
    - name: "受控實驗"
      evidence: "PCB1 用於發現問題，只做一項事先登錄的修改，在 PCB2 做一次確認性測試；另在 PCB3 做一項受控光照實驗。"
    - name: "Go / No-Go"
      evidence: "依未修改的準則以規則判定；建議：暫不試行。"
    - name: "跨場域準備與交接"
      evidence: "把每個觀察到的失效對應到新場域必須驗證的項目；含版本、檢核關卡、回滾與升級處理的交接。"

