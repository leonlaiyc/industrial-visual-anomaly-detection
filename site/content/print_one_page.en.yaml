# One-page executive summary (English, one A4 page, print/PDF) — the default executive download.
# Same rules as the site content: numbers only via {{ f.* }}. The two-page extended brief is print.en.yaml.

title: "Industrial Visual Inspection: From Prototype to Operational Decision"
subtitle: "Executive summary · independent project on public benchmark images (VisA), not factory data"
status: "Technical feasibility on public data only. Programmatic metric verification completed. Human owner review pending."

problem_h: "Problem and prototype"
problem: "On a production line, defects are rare and varied, so labelled defect examples are scarce. The question: can a model that has only seen good boards send the right circuit-board images to a human reviewer, without burying the reviewer in false alarms?"
built: "The prototype uses frozen pretrained CNN features and a per-position Gaussian (Mahalanobis) model of normal appearance, registers each board, and flags an image for review when its score exceeds a threshold frozen beforehand on separate normal images. It is fitted on normal images only — by design; VisA's defect labels and masks are used only for evaluation. It recommends a review and never rejects a board."

result_h: "Controlled improvement on PCB2, a board type not used in development"
result_sub: "v1 → v2: one pre-registered change — score only inside the board region. {{ f.pcb2.v2.recall.n }} defective + {{ f.pcb2.v2.fpr.n }} normal test images, thresholds frozen before testing, evaluated once; {{ f.ci_level }} confidence intervals."
rows:
  - label: "Defect recall"
    v1: "{{ f.pcb2.v1.recall.pct }}"
    v2: "{{ f.pcb2.v2.recall.pct }}"
    change: "unchanged"
  - label: "False alarms, test normals"
    v1: "{{ f.pcb2.v1.fpr.pct }}"
    v2: "{{ f.pcb2.v2.fpr.pct }}"
    change: "{{ f.pcb2.paired.fpr_test.delta }} pts (CI {{ f.pcb2.paired.fpr_test.ci_low }} to {{ f.pcb2.paired.fpr_test.ci_high }})"
  - label: "False alarms, holdout normals"
    v1: "{{ f.pcb2.v1.fpr_holdout.pct }}"
    v2: "{{ f.pcb2.v2.fpr_holdout.pct }}"
    change: "{{ f.pcb2.paired.fpr_holdout.delta }} pts (CI {{ f.pcb2.paired.fpr_holdout.ci_low }} to {{ f.pcb2.paired.fpr_holdout.ci_high }})"
  - label: "AUROC"
    v1: "{{ f.pcb2.v1.auroc.fmt }}"
    v2: "{{ f.pcb2.v2.auroc.fmt }}"
    change: "{{ f.pcb2.paired.auroc.delta }} (CI {{ f.pcb2.paired.auroc.ci_low }} to {{ f.pcb2.paired.auroc.ci_high }})"
result_note: "Fewer false alarms and better ranking; recall did not improve and stays below the proposed {{ f.criteria.recall_min }} target. Median latency per image (GPU): v1 {{ f.pcb2.v1.latency_ms.fmt }} ms, v2 {{ f.pcb2.v2.latency_ms.fmt }} ms."

pcb3_h: "Follow-up finding on PCB3, a separate board type"
pcb3: "A pre-registered global brightness/contrast correction met its own decision rule (“{{ f.pcb3.result.outcome }}”; darkening difference {{ f.pcb3.result.cond.G1.fpr.did }} pts, CI {{ f.pcb3.result.cond.G1.fpr.ci_low }} to {{ f.pcb3.result.cond.G1.fpr.ci_high }}), but that result is <strong>weakly informative</strong>, and the correction made a mild blur raise false alarms by {{ f.pcb3.result.blur.cand.rise }} pts. <strong>Decision: do not adopt it.</strong> The uncorrected pipeline is not production-ready either: brightening raised its false alarms by {{ f.pcb3.detail.cond.B1.base.rise }} pts. PCB3 numbers are not comparable with PCB2's."
disclosure: "Disclosure: after PCB3 test scoring, one input check in the analysis program was repaired ({{ f.repair.fix_sha }}); no score, threshold or decision changed. Full record in the repository."

risks_h: "Remaining risks"
risks:
  - "<strong>Detection:</strong> recall {{ f.pcb2.v2.recall.pct }} against a proposed {{ f.criteria.recall_min }}; the smallest third of defects only {{ f.pcb2.small.recall }}."
  - "<strong>Lighting:</strong> a {{ f.pcb2.dark_pct }} darker image raised PCB2 false alarms from {{ f.pcb2.dark.v2.clean }} to {{ f.pcb2.dark.v2.dark }}."
  - "<strong>Portability:</strong> on a green background the original board-finding rule marked {{ f.pcb3_mask.original }} of the frame as board, silently."
  - "<strong>Evidence base:</strong> benchmark images and synthetic perturbations; targets are the developer's proposal. No end user, factory image, pilot or financial return."

decision_h: "Go / No-Go"
decision: "<strong>No-Go for a manufacturing pilot.</strong> Although v2 improved false-positive performance, it did not meet the proposed detection-sensitivity and robustness requirements. It is therefore not recommended for a manufacturing pilot without further work. Rule-based verdict against the unchanged criteria: {{ f.pcb2.verdict.v2 }}."
go: "<strong>Go for one bounded validation step</strong> — no further model work before it."

next_h: "Next recommended validation step"
next:
  - "Agree requirements with a quality engineer: cost of a missed defect versus one review, review capacity, defects that matter."
  - "Run the unchanged tool in shadow mode on real line images, affecting no decision."
  - "Entry gates: board segmentation and registration on the site's own normal images; a per-image lighting check; a labelled sample of real defects, with recall reported by defect size."
  - "Decide Go / No-Go again on that evidence."

footer:
