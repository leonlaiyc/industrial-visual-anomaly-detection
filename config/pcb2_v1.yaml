# PCB2 v1 baseline (full-frame max)
# PCB2 prospective validation (docs/v2_experiment_protocol.md). Generated from
# config/default.yaml: identical model/preprocess/calibration/robustness settings;
# differs only in dataset paths/sizes, output directories and the `scoring` section.
#
# (Original header follows.) Industrial Visual Anomaly Detection — PCB1 PoC configuration.
# Every setting that affects results lives here. Its canonical hash is
# recorded in reports/frozen_operating_point.json; `ivad evaluate` refuses to
# run if this file changed after the threshold was frozen.

seed: 20261008
run_name: PCB2 v1 baseline (full-frame max)

paths:
  root: null                         # null = repository root
  archive: data/raw/VisA_20220922.tar
  data_dir: data/visa                # extracted pcb2/ lives here (gitignored)
  official_manifest: manifests/visa_1cls_pcb2.csv
  split_manifest: manifests/split_pcb2.csv
  artifacts: artifacts/pcb2_v1      # fitted model state (gitignored)
  reports: reports/pcb2_v1
  inspection: reports/pcb2_inspection   # FIT-normal inspection (shared by v1 and v2)
  figures: reports/pcb2_v1/figures

dataset:
  name: VisA
  object: pcb2
  archive_url: https://amazon-visual-anomaly.s3.us-west-2.amazonaws.com/VisA_20220922.tar
  archive_bytes: 1929840640
  manifest_url: https://raw.githubusercontent.com/amazon-science/spot-diff/main/split_csv/1cls.csv
  n_fit: 600
  n_calib: 150
  n_holdout: 151
  n_test_normal: 100
  n_test_anomaly: 100

preprocess:
  # Decided from FIT normals only (reports/inspection/, docs/engineering_decisions.md D2-D3):
  # boards vary in placement (~±70 px), tilt (~±3°) and 19% are rotated 180°.
  register: true                     # mask-moment registration + 0/180° by template NCC
  crop_wh: [1152, 768]               # centred crop of the registered frame (native px)
  size_hw: [512, 768]                # model input; 1.5x downsample of the crop

model:
  backbone: wide_resnet50_2
  pretrained: true                   # torchvision IMAGENET1K_V1
  layers: [layer2, layer3]
  n_features: 128                    # random channel subset (of 1536)
  feature_seed: 0
  pool_kernel: 3                     # 3x3 local neighbourhood average
  cov_reg_rel: 0.01                  # ridge = rel * mean(diag Sigma) + eps
  cov_reg_eps: 1.0e-6
  map_sigma: 4.0                     # Gaussian smoothing of the upsampled map (pixels)

calibration:
  # name -> target FPR on calibration normals (conformal order statistic)
  candidates:
    P90: 0.10
    P95: 0.05
    P99: 0.01
  primary: P95
  level: 0.95

evaluation:
  level: 0.95
  n_bootstrap: 2000
  bootstrap_seed: 7
  latency_warmup: 5
  require_committed_freeze: true     # evaluate refuses unless the frozen state is committed

robustness:
  # Applied to the ORIGINAL full-resolution image before preprocessing.
  # Severities fixed from FIT-normal inspection, before any test scoring.
  # Natural mean-brightness spread of FIT normals is about ±4%.
  perturbations:
    - {name: darker_lower_contrast, kind: photometric, brightness: 0.90, contrast: 0.90}
    - {name: brighter_higher_contrast, kind: photometric, brightness: 1.10, contrast: 1.10}
    - {name: gaussian_blur_s1.5, kind: blur, sigma_px: 1.5}
    - {name: shift_40_25px, kind: shift, dx_px: 40, dy_px: 25}
  n_bootstrap: 2000
  bootstrap_seed: 11

cost:
  k_min: 0.01
  k_max: 100.0

runtime:
  device: cuda                       # falls back to cpu if CUDA is unavailable
  batch_size: 8
  num_workers: 8                     # threads for JPEG decode + registration

scoring:
  aggregation: full_max              # v1: image score = max of the anomaly map over the whole frame
