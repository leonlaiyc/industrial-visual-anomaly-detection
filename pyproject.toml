[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivad"
version = "0.1.0"
description = "Hands-on PCB anomaly detection PoC: normal-only CNN, ROI and robustness experiments, supervised YOLO exploration"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.24",
  "scipy>=1.10",
  "pillow>=10",
  "matplotlib>=3.7",
  "pyyaml>=6",
  "reportlab>=4",
  "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=7", "scikit-learn>=1.3"]
site = ["jinja2>=3.1"]

[project.scripts]
ivad = "ivad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
